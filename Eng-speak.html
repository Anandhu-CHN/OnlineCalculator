<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Diya AI Tutor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { 
            --g-blue: #4285f4; --g-red: #ea4335; 
            --g-yellow: #fbbc05; --g-green: #34a853; 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; filter: blur(80px); opacity: 0.6; }

        .top-nav { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .nav-btn svg { width: 20px; height: 20px; fill: #fff; }

        .panel {
            position: absolute; top: 80px; right: 20px; z-index: 101;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 20px; width: 280px; display: none; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-height: 60vh; overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.04); padding: 14px; border-radius: 16px;
            margin-bottom: 12px; font-size: 13px; border-left: 4px solid var(--g-blue);
            position: relative;
        }
        .del-one { position: absolute; top: 8px; right: 10px; opacity: 0.4; cursor: pointer; }
        
        .voice-option {
            padding: 14px; margin: 8px 0; border-radius: 14px; cursor: pointer;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.05); transition: 0.2s;
        }
        .voice-option.active { border-color: var(--g-blue); background: rgba(66, 133, 244, 0.15); }

        .main-shell {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .main-shell { justify-content: flex-end; padding-bottom: calc(50px + env(safe-area-inset-bottom)); }
        }

        .chat-bubble {
            width: 100%; max-width: 480px; margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(40px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px; box-sizing: border-box;
        }

        #status-indicator { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; }
        #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g-blue); }
        #transcript { color: #fff; font-size: 18px; margin-top: 18px; min-height: 40px; line-height: 1.5; font-weight: 300; }

        .mic-wrap { display: flex; flex-direction: column; align-items: center; }
        .mic-btn {
            width: 80px; height: 80px; border-radius: 50%; background: #fff; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .mic-btn svg { width: 32px; height: 32px; fill: #111; }
        .pulse { background: var(--g-red) !important; transform: scale(1.1); box-shadow: 0 0 40px rgba(234, 67, 53, 0.4); }
        .pulse svg { fill: #fff !important; }

        .login-overlay { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 18px; border-radius: 16px; width: 280px; margin-bottom: 20px; text-align: center; }
        .start-btn { background: #fff; color: #000; border: none; padding: 16px 50px; border-radius: 40px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="top-nav">
    <div class="nav-btn" onclick="togglePanel('history-panel')">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </div>
    <div class="nav-btn" onclick="togglePanel('voice-menu')">
        <svg viewBox="0 0 24 24"><path d="M5 16L3 5L8.5 10L12 4L15.5 10L21 5L19 16H5M19 19C19 19.6 18.6 20 18 20H6C5.4 20 5 19.6 5 19V18H19V19Z" fill="#fbbc05"/></svg>
    </div>
</div>

<div id="voice-menu" class="panel">
    <div style="font-size: 11px; opacity: 0.5; letter-spacing: 1.5px; margin-bottom: 15px; font-weight: 700;">4 VOICE OPTIONS</div>
    <div id="voice-list"></div>
</div>

<div id="history-panel" class="panel">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <span style="font-size:11px; font-weight:700; opacity:0.6;">HISTORY</span>
        <span onclick="clearHistory()" style="color:var(--g-red); font-size:10px; cursor:pointer;">CLEAR ALL</span>
    </div>
    <div id="history-list"></div>
</div>

<div id="login" class="login-overlay">
    <h1 style="color:#fff; font-weight:200; letter-spacing:2px; margin-bottom:30px;">DIYA <span style="color:var(--g-blue)">TUTOR</span></h1>
    <input type="password" id="hfToken" placeholder="Hugging Face API Token">
    <button class="start-btn" onclick="initApp()">START LESSON</button>
</div>

<div class="main-shell">
    <div class="chat-bubble">
        <div id="status-indicator"><div id="status-dot"></div><span id="status-text">Ready</span></div>
        <div id="transcript">Tap the mic to begin...</div>
    </div>
    <div class="mic-wrap">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>
</div>

<script>
    let token, scene, camera, renderer, recognition, selectedVoice;
    const synth = window.speechSynthesis;
    let isListening = false, isSpeaking = false, blobs = [], historyData = JSON.parse(localStorage.getItem('diya_history') || '[]');

    function initBackground() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const colors = [0x4285f4, 0xea4335, 0xfbbc05, 0x34a853];
        colors.forEach(col => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(3, 64, 64), new THREE.MeshBasicMaterial({ color: col }));
            mesh.position.set((Math.random()-0.5)*12, (Math.random()-0.5)*12, -10);
            scene.add(mesh);
            blobs.push({ mesh, offset: Math.random() * Math.PI, speed: 0.003 + Math.random()*0.005 });
        });
        function animate(t) {
            requestAnimationFrame(animate);
            let p = (isListening || isSpeaking) ? Math.sin(t*0.01)*0.2 + 1.2 : 1.0;
            blobs.forEach((b, i) => {
                b.mesh.scale.setScalar(p + Math.sin(t * b.speed + b.offset) * 0.1);
                b.mesh.position.x += Math.cos(t * 0.001 + i) * 0.005;
            });
            renderer.render(scene, camera);
        }
        animate(0);
    }

    function initMic() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = (e) => {
            let f = '';
            for (let i = e.resultIndex; i < e.results.length; ++i) { if (e.results[i].isFinal) f += e.results[i][0].transcript; }
            if (f) { toggleMic(false); askAI(f); }
        };
        recognition.onstart = () => { isListening = true; updateStatus("Listening", "var(--g-red)"); document.getElementById('micBtn').classList.add('pulse'); };
        recognition.onend = () => { isListening = false; document.getElementById('micBtn').classList.remove('pulse'); if(!isSpeaking) updateStatus("Ready", "var(--g-blue)"); };
    }

    async function askAI(text) {
        updateStatus("Thinking", "var(--g-yellow)");
        try {
            const res = await fetch("https://api-inference.huggingface.co/models/meta-llama/Llama-3.2-3B-Instruct", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${token.trim()}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    inputs: `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\nYou are Diya, a brief English tutor. Correct grammar starting with 'Actually...' then answer in 1 sentence.<|eot_id|><|start_header_id|>user<|end_header_id|>\n${text}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n`,
                    parameters: { max_new_tokens: 60, return_full_text: false, stop: ["<|eot_id|>"] }
                })
            });

            const data = await res.json();

            if (!res.ok) {
                if (res.status === 503 || (data.error && data.error.includes("loading"))) {
                    updateStatus("Waking AI...", "var(--g-yellow)");
                    document.getElementById('transcript').innerText = "AI is warming up... please wait 10s.";
                    setTimeout(() => askAI(text), 8000); 
                    return;
                }
                throw new Error(data.error || `Status ${res.status}`);
            }

            let reply = Array.isArray(data) ? data[0].generated_text : data.generated_text;
            reply = reply.replace(/<\|[\s\S]*?\|>/g, '').trim();
            
            saveToHistory(text, reply);
            speak(reply);

        } catch (e) { 
            updateStatus("Error", "var(--g-red)");
            document.getElementById('transcript').innerText = "Error: " + e.message;
            speak("Connection error.");
        }
    }

    function saveToHistory(u, d) {
        historyData.push({ id: Date.now(), u, d });
        localStorage.setItem('diya_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        document.getElementById('history-list').innerHTML = historyData.map(h => `
            <div class="history-item">
                <span class="del-one" onclick="deleteEntry(${h.id})">✕</span>
                <div style="opacity:0.5; font-size:10px;">YOU: "${h.u}"</div>
                <div style="margin-top:5px;">${h.d}</div>
            </div>
        `).join('');
    }

    function deleteEntry(id) { historyData = historyData.filter(h => h.id !== id); localStorage.setItem('diya_history', JSON.stringify(historyData)); renderHistory(); }
    function clearHistory() { if(confirm("Clear?")) { historyData=[]; localStorage.removeItem('diya_history'); renderHistory(); } }
    
    function togglePanel(id) {
        const p = document.getElementById(id);
        const v = p.style.display === 'block';
        document.querySelectorAll('.panel').forEach(x => x.style.display = 'none');
        p.style.display = v ? 'none' : 'block';
    }

    function loadVoices() {
        const list = document.getElementById('voice-list');
        list.innerHTML = '';
        let vcs = synth.getVoices().filter(v => v.lang.startsWith('en')).slice(0, 4);
        vcs.forEach((v, i) => {
            const d = document.createElement('div');
            d.className = `voice-option ${i === 0 ? 'active' : ''}`;
            d.innerHTML = `<div><span style="font-weight:700;">Profile ${i+1}</span><br><small style="opacity:0.4">${v.name.split(' ')[0]}</small></div>`;
            d.onclick = () => { selectedVoice = v; document.querySelectorAll('.voice-option').forEach(x => x.classList.remove('active')); d.classList.add('active'); };
            list.appendChild(d);
            if(i === 0) selectedVoice = v;
        });
    }

    function speak(t) {
        isSpeaking = true;
        updateStatus("Speaking", "var(--g-green)");
        const m = new SpeechSynthesisUtterance(t);
        if(selectedVoice) m.voice = selectedVoice;
        m.onstart = () => document.getElementById('transcript').innerText = t;
        m.onend = () => { isSpeaking = false; updateStatus("Ready", "var(--g-blue)"); };
        synth.speak(m);
    }

    window.toggleMic = (f) => {
        if(isSpeaking) synth.cancel();
        const t = (f !== undefined) ? f : !isListening;
        if(t) { try { recognition.start(); } catch(e) {} } else { recognition.stop(); }
    };

    function updateStatus(t, c) { document.getElementById('status-text').innerText = t; document.getElementById('status-dot').style.backgroundColor = c; }

    function initApp() {
        token = document.getElementById('hfToken').value;
        if(!token) return alert("Token required.");
        document.getElementById('login').style.display = 'none';
        initBackground();
        initMic();
        loadVoices();
        renderHistory();
        speak("System initialized.");
    }
    
    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = loadVoices;
    window.addEventListener('resize', () => {
        if(renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }
    });
</script>
</body>
</html>
