<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live English Tutor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>
    <style>
        :root { --blue: #4285f4; --bg: #000; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Mobile Gemini Live Orb */
        .orb-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .orb { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, #8ab4f8, #4285f4); filter: blur(2px); box-shadow: 0 0 40px var(--blue); transition: all 0.5s ease; }
        .listening { animation: pulse 1.2s infinite ease-in-out; scale: 1.1; filter: blur(10px); }
        
        @keyframes pulse { 0% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.1); } 100% { opacity: 0.6; transform: scale(1); } }

        #display { position: absolute; bottom: 15%; width: 85%; text-align: center; font-size: 20px; font-weight: 400; color: #e8eaed; }
        #correction { color: #fcc934; font-size: 16px; margin-top: 12px; font-weight: 500; height: 40px; }

        .btn-start { position: absolute; bottom: 40px; padding: 15px 40px; border-radius: 30px; border: none; background: #fff; color: #000; font-weight: bold; font-size: 16px; cursor: pointer; box-shadow: 0 4px 15px rgba(255,255,255,0.2); }
    </style>
</head>
<body>

<div class="orb-container">
    <div class="orb" id="orb"></div>
    <div id="display">
        <div id="stt">Ready to speak?</div>
        <div id="correction"></div>
    </div>
    <button class="btn-start" id="mainBtn">START CONVERSATION</button>
</div>

<script>
    let model, recognition;
    const orb = document.getElementById('orb');
    const stt = document.getElementById('stt');
    const correction = document.getElementById('correction');
    const btn = document.getElementById('mainBtn');

    // 1. Initialize TF.js with Mobile optimization (WASM/WebGL)
    async function loadAI() {
        stt.innerText = "Initializing AI...";
        await tf.setBackend('webgl'); 
        model = await use.load();
        stt.innerText = "AI Loaded. Tap to Start.";
    }

    // 2. Setup Web Speech for Mobile
    function startContinuousSpeech() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Speech not supported on this browser. Use Chrome or Safari.");
            return;
        }

        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            orb.classList.add('listening');
            stt.innerText = "I'm listening...";
            btn.style.display = "none";
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript = event.results[i][0].transcript;
                    processEnglish(finalTranscript);
                } else {
                    stt.innerText = event.results[i][0].transcript;
                }
            }
        };

        recognition.onerror = (e) => console.error("Speech Error:", e);
        recognition.onend = () => recognition.start(); // Keep it live
        recognition.start();
    }

    // 3. 1:1 Grammar/Fluency Correction
    async function processEnglish(text) {
        stt.innerText = text;
        const lower = text.toLowerCase();
        let feedback = "";

        // Core Grammar Rules (Can be replaced with a secondary TF model)
        if (lower.includes("i is")) feedback = "Say 'I am' instead of 'I is'.";
        if (lower.includes("he don't")) feedback = "Try 'He doesn't' for better fluency.";
        if (text.split(' ').length < 3) feedback = "Try using longer sentences.";

        if (feedback) {
            correction.innerText = "💡 " + feedback;
            speak(feedback);
        } else {
            correction.innerText = "✨ Fluent English";
        }
    }

    function speak(text) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'en-US';
        msg.rate = 1.0;
        window.speechSynthesis.speak(msg);
    }

    btn.onclick = () => {
        if (!model) return;
        startContinuousSpeech();
    };

    loadAI();
</script>
</body>
</html>
