<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Live Tutor</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>
    <style>
        body { background: #000; color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; align-items: center; justify-content: center; }
        .orb { width: 200px; height: 200px; border-radius: 50%; background: linear-gradient(45deg, #4285f4, #9b51e0); filter: blur(15px); transition: all 0.3s ease; opacity: 0.6; }
        .listening { transform: scale(1.1); filter: blur(30px); opacity: 1; animation: talk 0.8s infinite alternate; }
        @keyframes talk { from { transform: scale(1); } to { transform: scale(1.2); } }
        #text-box { margin-top: 30px; text-align: center; width: 80%; font-size: 22px; color: #bdc1c6; }
        #ai-reply { margin-top: 15px; font-size: 18px; color: #8ab4f8; font-weight: bold; min-height: 1.5em; }
        .btn-live { position: absolute; bottom: 50px; background: #fff; color: #000; border: none; padding: 15px 40px; border-radius: 50px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="orb" id="orb"></div>
<div id="text-box">Tap "Start Live" and say hello!</div>
<div id="ai-reply"></div>
<button class="btn-live" id="actionBtn">START LIVE SESSION</button>

<script>
    let model, recognition;
    const orb = document.getElementById('orb');
    const textBox = document.getElementById('text-box');
    const aiReply = document.getElementById('ai-reply');
    const btn = document.getElementById('actionBtn');

    // 1. Load Brain (Universal Sentence Encoder)
    async function initAI() {
        textBox.innerText = "Connecting to Neural Network...";
        model = await use.load();
        textBox.innerText = "Ready for 1:1 Conversation.";
    }

    // 2. The Interaction Logic (Responding to you)
    async function getAIResponse(userText) {
        const input = userText.toLowerCase();
        let response = "";
        let correction = "";

        // Grammar Check Logic
        if (input.includes("i is")) correction = "Careful, you should say 'I am'. ";
        if (input.includes("how you is")) correction = "Try saying 'How are you'. ";

        // Conversational Response Logic (Responding to your intent)
        if (input.includes("hello") || input.includes("hi")) {
            response = "Hello! I'm your English partner. What shall we discuss today?";
        } else if (input.includes("how are you")) {
            response = "I'm functioning perfectly and ready to help you practice English!";
        } else if (input.includes("weather")) {
            response = "I don't have a thermometer, but your English is sounding clear!";
        } else if (input.includes("thank")) {
            response = "You're very welcome. Your fluency is improving!";
        } else {
            response = "That's interesting. Tell me more about that so I can check your sentence structure.";
        }

        const finalOutput = correction + response;
        aiReply.innerText = finalOutput;
        speak(finalOutput);
    }

    // 3. Live Audio Loop
    function startLive() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            orb.classList.add('listening');
            btn.style.display = 'none';
        };

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    getAIResponse(transcript);
                }
            }
            textBox.innerText = transcript;
        };

        recognition.onend = () => recognition.start(); // Auto-restart for continuous feel
        recognition.start();
    }

    function speak(text) {
        window.speechSynthesis.cancel(); // Stop current speech to respond to new input
        const msg = new SpeechSynthesisUtterance(text);
        msg.rate = 1.1;
        window.speechSynthesis.speak(msg);
    }

    btn.onclick = () => { if(model) startLive(); };
    initAI();
</script>
</body>
</html>
