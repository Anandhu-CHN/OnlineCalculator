<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Diya AI Tutor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { 
            --g-blue: #4285f4; --g-red: #ea4335; 
            --g-yellow: #fbbc05; --g-green: #34a853; 
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        #bg-canvas { position: absolute; top: 0; left: 0; z-index: 1; filter: blur(80px); opacity: 0.6; }

        .top-nav { position: absolute; top: 20px; right: 20px; z-index: 100; display: flex; gap: 12px; }
        .nav-btn {
            background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1);
            width: 44px; height: 44px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px);
        }
        .nav-btn svg { width: 20px; height: 20px; fill: #fff; }

        .panel {
            position: absolute; top: 80px; right: 20px; z-index: 101;
            background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 24px;
            padding: 20px; width: 280px; display: none; color: white;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); max-height: 60vh; overflow-y: auto;
        }

        .history-item {
            background: rgba(255,255,255,0.04); padding: 14px; border-radius: 16px;
            margin-bottom: 12px; font-size: 13px; border-left: 4px solid var(--g-blue);
            position: relative;
        }
        
        .main-shell {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; padding: 20px; box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .main-shell { justify-content: flex-end; padding-bottom: calc(60px + env(safe-area-inset-bottom)); }
        }

        .chat-bubble {
            width: 100%; max-width: 480px; margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.04); backdrop-filter: blur(40px);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 28px; box-sizing: border-box;
        }

        #status-indicator { display: flex; align-items: center; gap: 8px; font-size: 10px; font-weight: 700; color: #888; text-transform: uppercase; }
        #status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g-blue); transition: 0.3s; }
        #transcript { color: #fff; font-size: 18px; margin-top: 18px; min-height: 40px; line-height: 1.5; font-weight: 300; }

        .mic-wrap { display: flex; flex-direction: column; align-items: center; }
        .mic-btn {
            width: 80px; height: 80px; border-radius: 50%; background: #fff; border: none; cursor: pointer;
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); transition: 0.4s;
        }
        .pulse { background: var(--g-red) !important; transform: scale(1.1); box-shadow: 0 0 40px rgba(234, 67, 53, 0.4); }

        .login-overlay { position: fixed; inset: 0; z-index: 1000; background: #000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        input { background: #111; border: 1px solid #333; color: #fff; padding: 18px; border-radius: 16px; width: 280px; margin-bottom: 20px; text-align: center; font-size: 16px; }
        .start-btn { background: #fff; color: #000; border: none; padding: 16px 50px; border-radius: 40px; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="top-nav">
    <div class="nav-btn" onclick="togglePanel('history-panel')">
        <svg viewBox="0 0 24 24"><path d="M13 3c-4.97 0-9 4.03-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42C8.27 19.99 10.51 21 13 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
    </div>
</div>

<div id="history-panel" class="panel">
    <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
        <span style="font-size:11px; font-weight:700; opacity:0.6;">HISTORY</span>
        <span onclick="clearHistory()" style="color:var(--g-red); font-size:10px; cursor:pointer;">CLEAR</span>
    </div>
    <div id="history-list"></div>
</div>

<div id="login" class="login-overlay">
    <h1 style="color:#fff; font-weight:200; letter-spacing:2px; margin-bottom:30px;">DIYA <span style="color:var(--g-blue)">TUTOR</span></h1>
    <input type="password" id="hfToken" placeholder="Hugging Face Token" autocomplete="off">
    <button class="start-btn" onclick="initApp()">START LESSON</button>
</div>

<div class="main-shell">
    <div class="chat-bubble">
        <div id="status-indicator"><div id="status-dot"></div><span id="status-text">Ready</span></div>
        <div id="transcript">Tap the mic to talk...</div>
    </div>
    <div class="mic-wrap">
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">
            <svg viewBox="0 0 24 24" width="32" height="32"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </button>
    </div>
</div>

<script>
    let token, scene, camera, renderer, recognition;
    const synth = window.speechSynthesis;
    let isListening = false, isSpeaking = false, blobs = [], historyData = JSON.parse(localStorage.getItem('diya_history') || '[]');

    function initBackground() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('bg-canvas'), antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const colors = [0x4285f4, 0xea4335, 0xfbbc05, 0x34a853];
        colors.forEach(col => {
            const mesh = new THREE.Mesh(new THREE.SphereGeometry(3, 32, 32), new THREE.MeshBasicMaterial({ color: col }));
            mesh.position.set((Math.random()-0.5)*10, (Math.random()-0.5)*10, -10);
            scene.add(mesh);
            blobs.push({ mesh, offset: Math.random() * 10, speed: 0.002 + Math.random()*0.003 });
        });
        function animate(t) {
            requestAnimationFrame(animate);
            let p = (isListening || isSpeaking) ? Math.sin(t*0.01)*0.2 + 1.1 : 1.0;
            blobs.forEach((b, i) => {
                b.mesh.scale.setScalar(p + Math.sin(t * b.speed + b.offset) * 0.1);
                b.mesh.position.y += Math.cos(t * 0.001 + i) * 0.005;
            });
            renderer.render(scene, camera);
        }
        animate(0);
    }

    function initMic() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!Speech) {
            alert("Your browser doesn't support Speech Recognition. Please use Chrome or Safari.");
            return;
        }
        recognition = new Speech();
        recognition.lang = 'en-US';
        recognition.continuous = false; // Mobile works better with false
        recognition.interimResults = false;

        recognition.onresult = (e) => {
            const result = e.results[0][0].transcript;
            document.getElementById('transcript').innerText = result;
            askAI(result);
        };

        recognition.onstart = () => {
            isListening = true;
            updateStatus("Listening", "var(--g-red)");
            document.getElementById('micBtn').classList.add('pulse');
        };

        recognition.onend = () => {
            isListening = false;
            document.getElementById('micBtn').classList.remove('pulse');
            if(!isSpeaking) updateStatus("Ready", "var(--g-blue)");
        };

        recognition.onerror = (e) => {
            console.error("Mic Error:", e.error);
            updateStatus("Ready", "var(--g-blue)");
            document.getElementById('micBtn').classList.remove('pulse');
        };
    }

    async function askAI(text) {
        updateStatus("Thinking", "var(--g-yellow)");
        try {
            const response = await fetch("https://api-inference.huggingface.co/models/meta-llama/Llama-3.2-3B-Instruct", {
                method: "POST",
                headers: { 
                    "Authorization": `Bearer ${token.trim()}`, 
                    "Content-Type": "application/json" 
                },
                body: JSON.stringify({
                    inputs: `<|begin_of_text|><|start_header_id|>system<|end_header_id|>\nYou are Diya, a brief English tutor. Correct grammar then answer in 1 sentence.<|eot_id|><|start_header_id|>user<|end_header_id|>\n${text}<|eot_id|><|start_header_id|>assistant<|end_header_id|>\n`,
                    parameters: { max_new_tokens: 60, return_full_text: false }
                })
            });

            const data = await response.json();

            if (response.status === 503 || (data.error && data.error.includes("loading"))) {
                updateStatus("Waking AI...", "var(--g-yellow)");
                document.getElementById('transcript').innerText = "Diya is waking up... please wait 10s.";
                setTimeout(() => askAI(text), 8000); 
                return;
            }

            if (!response.ok) throw new Error(data.error || "Fetch Error");

            let reply = Array.isArray(data) ? data[0].generated_text : data.generated_text;
            reply = reply.replace(/<\|[\s\S]*?\|>/g, '').trim();
            
            saveToHistory(text, reply);
            speak(reply);

        } catch (e) { 
            updateStatus("Error", "var(--g-red)");
            document.getElementById('transcript').innerText = "Check Connection/Token.";
            console.error(e);
        }
    }

    function speak(text) {
        if (isSpeaking) synth.cancel();
        isSpeaking = true;
        updateStatus("Speaking", "var(--g-green)");
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        
        utterance.onstart = () => { document.getElementById('transcript').innerText = text; };
        utterance.onend = () => { 
            isSpeaking = false; 
            updateStatus("Ready", "var(--g-blue)"); 
        };

        synth.speak(utterance);
    }

    function toggleMic() {
        if (isSpeaking) {
            synth.cancel();
            isSpeaking = false;
        }
        try {
            recognition.start();
        } catch(e) {
            recognition.stop();
        }
    }

    function updateStatus(t, c) {
        document.getElementById('status-text').innerText = t;
        document.getElementById('status-dot').style.backgroundColor = c;
    }

    function saveToHistory(u, d) {
        historyData.unshift({ id: Date.now(), u, d });
        if(historyData.length > 10) historyData.pop();
        localStorage.setItem('diya_history', JSON.stringify(historyData));
        renderHistory();
    }

    function renderHistory() {
        document.getElementById('history-list').innerHTML = historyData.map(h => `
            <div class="history-item">
                <div style="opacity:0.5; font-size:10px;">YOU: ${h.u}</div>
                <div style="margin-top:5px;">${h.d}</div>
            </div>
        `).join('');
    }

    function clearHistory() { historyData=[]; localStorage.removeItem('diya_history'); renderHistory(); }
    
    function togglePanel(id) {
        const p = document.getElementById(id);
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function initApp() {
        token = document.getElementById('hfToken').value;
        if(!token) return alert("Please enter a Hugging Face Token.");
        
        // Mobile sound unlock
        speak(""); 

        document.getElementById('login').style.display = 'none';
        initBackground();
        initMic();
        renderHistory();
        
        setTimeout(() => speak("Hi, I'm Diya. I'm ready to help you with English."), 500);
    }

    window.addEventListener('resize', () => {
        if(renderer) {
            renderer.setSize(window.innerWidth, window.innerHeight);
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
        }
    });
</script>
</body>
</html>
