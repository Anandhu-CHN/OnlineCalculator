<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diya Live: 3D AI Tutor</title>
    <style>
        body { margin: 0; background: radial-gradient(circle, #1a1a2e 0%, #000 100%); overflow: hidden; color: white; font-family: 'Inter', sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* UI HUD */
        .hud { position: absolute; bottom: 50px; width: 100%; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
        #status { font-size: 12px; letter-spacing: 3px; color: #4facfe; text-transform: uppercase; margin-bottom: 15px; }
        #transcript { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 15px 30px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.2); max-width: 80%; text-align: center; font-size: 18px; }

        .loading-screen { position: fixed; inset: 0; background: #000; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.5s; }
        .btn { pointer-events: auto; padding: 15px 40px; background: #4facfe; border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; margin-top: 20px; }
    </style>
</head>
<body>

<div id="loading" class="loading-screen">
    <h1 id="load-text">Loading Diya's World...</h1>
    <input type="password" id="hfToken" placeholder="Enter HF Token" style="padding:10px; border-radius:5px; border:none; margin-top:10px;">
    <button class="btn" onclick="startApp()">WAKE UP DIYA</button>
</div>

<div id="canvas-container"></div>

<div class="hud">
    <div id="status">Diya is resting</div>
    <div id="transcript">Welcome! I'm Diya.</div>
</div>

<script type="module">
    import * as THREE from 'https://cdn.skypack.dev/three@0.132.2';
    import { GLTFLoader } from 'https://cdn.skypack.dev/three@0.132.2/examples/jsm/loaders/GLTFLoader.js';
    import { HfInference } from "https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/+esm";

    let scene, camera, renderer, model, mixer, hf;
    const loader = new GLTFLoader();

    // 1. Initialize 3D Scene
    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.4, 2);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        scene.add(hemiLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(0, 2, 1);
        scene.add(dirLight);

        // Load Avatar (Diya)
        // Using a high-quality placeholder avatar from a trusted source
        const avatarURL = 'https://models.readyplayer.me/646fd186835a643fd963690d.glb'; 
        
        loader.load(avatarURL, (gltf) => {
            model = gltf.scene;
            scene.add(model);
            document.getElementById('load-text').innerText = "Diya is Ready!";
        });
    }

    // 2. Logic to Start
    window.startApp = () => {
        const token = document.getElementById('hfToken').value;
        if(!token) return alert("Please enter your Hugging Face Token first.");
        hf = new HfInference(token);
        document.getElementById('loading').style.opacity = '0';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 500);
        
        startListening();
        speak("Hi! I'm Diya. I've been waiting to chat with you. How are you today?");
    };

    // 3. The "Ear" (Speech to Text)
    function startListening() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new Speech();
        recognition.lang = 'en-US';

        recognition.onstart = () => { document.getElementById('status').innerText = "Diya is Listening..."; };
        recognition.onresult = async (e) => {
            const input = e.results[0][0].transcript;
            document.getElementById('transcript').innerText = input;
            
            // Connect to Brain
            const out = await hf.chatCompletion({
                model: "mistralai/Mistral-7B-Instruct-v0.3",
                messages: [{ role: "user", content: `You are Diya, a cute and friendly girl tutor. Reply naturally: ${input}` }]
            });
            speak(out.choices[0].message.content);
        };
        recognition.onend = () => { if(!window.speechSynthesis.speaking) recognition.start(); };
        recognition.start();
    }

    // 4. The "Voice" (Text to Speech + Lip Sync)
    function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.onstart = () => {
            document.getElementById('status').innerText = "Diya is Speaking...";
            document.getElementById('transcript').innerText = text;
        };
        utter.onend = () => {
            document.getElementById('status').innerText = "Waiting...";
        };
        window.speechSynthesis.speak(utter);
    }

    // Animation Loop
    function animate() {
        requestAnimationFrame(animate);
        if (model) {
            // Natural idle breathing
            model.rotation.y = Math.sin(Date.now() * 0.001) * 0.05;
        }
        renderer.render(scene, camera);
    }

    init3D();
    animate();
</script>
</body>
</html>
