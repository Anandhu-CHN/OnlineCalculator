<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Native Local AI Tutor</title>
    <script type="module">
        import * as webllm from "https://esm.run/@mlc-ai/web-llm";

        let engine;
        const status = document.getElementById("status");
        const orb = document.getElementById("orb");
        const transcript = document.getElementById("transcript");

        // 1. Initialize Local Brain (Phi-3 is small & fast for mobile)
        async function init() {
            status.innerText = "Loading Local Brain (First time takes 1-2 mins)...";
            try {
                engine = await webllm.CreateMLCEngine("Phi-3-mini-4k-instruct-q4f16_1-MLC", {
                    initProgressCallback: (report) => {
                        status.innerText = report.text;
                    }
                });
                status.innerText = "Local Brain Ready. Tap to Speak.";
                document.getElementById("startBtn").disabled = false;
            } catch (e) {
                status.innerText = "WebGPU not supported. Use Chrome/Edge/Safari.";
            }
        }

        // 2. Real-time Conversation Logic
        async function chat(text) {
            orb.className = "orb thinking";
            const messages = [
                { role: "system", content: "You are a fluent English tutor. Chat naturally. Correct grammar briefly if I make a mistake." },
                { role: "user", content: text }
            ];

            const reply = await engine.chat.completions.create({ messages });
            const aiText = reply.choices[0].message.content;
            
            document.getElementById("ai-reply").innerText = aiText;
            speak(aiText);
        }

        // 3. Voice Logic (Native Speech)
        function speak(text) {
            orb.className = "orb speaking";
            const utter = new SpeechSynthesisUtterance(text);
            utter.onend = () => { orb.className = "orb listening"; startListening(); };
            window.speechSynthesis.speak(utter);
        }

        function startListening() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const rec = new SpeechRecognition();
            rec.lang = 'en-US';
            rec.onstart = () => { orb.className = "orb listening"; };
            rec.onresult = (e) => {
                const userText = e.results[0][0].transcript;
                transcript.innerText = "You: " + userText;
                chat(userText);
            };
            rec.start();
        }

        window.init = init;
        window.startListening = startListening;
        init();
    </script>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; height: 100vh; margin: 0; justify-content: center; }
        .orb { width: 150px; height: 150px; border-radius: 50%; background: #4285f4; filter: blur(20px); transition: 0.5s; }
        .listening { background: #34a853; transform: scale(1.2); animation: pulse 1s infinite; }
        .thinking { background: #fbbc05; animation: rotate 2s infinite; }
        .speaking { background: #ea4335; transform: scale(1.3); }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
        #status { font-size: 12px; color: #666; position: absolute; top: 20px; text-align: center; width: 90%; }
        #transcript { margin-top: 30px; font-size: 18px; color: #aaa; text-align: center; }
        #ai-reply { margin-top: 10px; font-weight: bold; font-size: 20px; text-align: center; width: 85%; }
        button { margin-top: 40px; padding: 15px 30px; border-radius: 30px; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="status">Checking WebGPU...</div>
    <div class="orb" id="orb"></div>
    <div id="transcript">Waiting for AI...</div>
    <div id="ai-reply"></div>
    <button id="startBtn" onclick="startListening()" disabled>START CONVERSATION</button>
</body>
</html>
