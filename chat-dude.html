<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Coach | Debug Mode</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col p-4">

    <div id="debug-log" class="bg-black text-lime-400 text-[10px] p-2 rounded mb-4 font-mono h-20 overflow-y-auto">
        System Initializing...
    </div>

    <div id="chat" class="flex-1 overflow-y-auto space-y-3 mb-4">
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200 max-w-[80%] text-slate-700">
            Hi! I am your local AI. Tell me: "How are you?"
        </div>
    </div>

    <div class="flex flex-col items-center gap-2 pb-6">
        <button id="micBtn" class="w-20 h-20 bg-blue-600 rounded-full shadow-lg flex items-center justify-center transition-all active:scale-95">
            <span id="micIcon" class="text-3xl text-white">🎤</span>
        </button>
        <p id="hint" class="text-slate-400 text-sm font-medium">Wait for "READY" status</p>
    </div>

<script>
    const log = (msg) => {
        const d = document.getElementById('debug-log');
        d.innerHTML += `> ${msg}<br>`;
        d.scrollTop = d.scrollHeight;
    };

    let model;
    const micBtn = document.getElementById('micBtn');
    const hint = document.getElementById('hint');

    // 1. Load the "Brain"
    async function init() {
        try {
            log("Loading TF.js Model...");
            model = await use.load();
            log("Model Loaded Successfully.");
            hint.innerText = "READY: Tap to speak";
            hint.classList.add('text-green-600');
        } catch (e) {
            log("MODEL ERROR: " + e.message);
        }
    }
    init();

    // 2. Setup the "Ears"
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        log("BROWSER ERROR: SpeechRecognition not supported.");
    } else {
        const rec = new SpeechRecognition();
        rec.lang = 'en-US';
        rec.continuous = false;

        micBtn.onclick = () => {
            try {
                rec.start();
                log("Microphone opened. SPEAK NOW.");
            } catch(e) { log("MIC ERROR: Already listening?"); }
        };

        rec.onstart = () => {
            micBtn.classList.replace('bg-blue-600', 'bg-red-500');
            hint.innerText = "LISTENING...";
        };

        rec.onerror = (e) => {
            log("MIC ERROR: " + e.error);
            if(e.error === 'not-allowed') log("FIX: Allow Mic in Browser Settings.");
        };

        rec.onresult = async (event) => {
            const text = event.results[0][0].transcript;
            log("I HEARD: " + text);
            addMsg(text, 'user');
            
            // Local AI Logic
            log("Thinking...");
            const reply = await getLocalReply(text);
            addMsg(reply, 'ai');
            speak(reply);
        };

        rec.onend = () => {
            micBtn.classList.replace('bg-red-500', 'bg-blue-600');
            hint.innerText = "Tap to speak again";
        };
    }

    async function getLocalReply(text) {
        // Very simple logic for simulation
        if(text.toLowerCase().includes("how are you")) return "I am doing great! Ready to help you with English.";
        if(text.toLowerCase().includes("joke")) return "Why was the math book sad? Because it had too many problems.";
        return "That's interesting! Can you say that in another way?";
    }

    function addMsg(text, type) {
        const div = document.createElement('div');
        div.className = type === 'ai' ? "bg-white p-3 rounded-lg border max-w-[80%]" : "bg-blue-600 text-white p-3 rounded-lg self-end max-w-[80%] ml-auto";
        div.innerText = text;
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'en-US';
        window.speechSynthesis.speak(utter);
    }
</script>
</body>
</html>
