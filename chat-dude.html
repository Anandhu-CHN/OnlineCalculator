<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Simulator (Local)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/universal-sentence-encoder"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col">

    <nav class="bg-white p-4 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-2">
            <div class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></div>
            <span class="font-bold text-gray-700">Gemini Local-v1</span>
        </div>
        <span id="engine-status" class="text-xs font-mono text-gray-400">LOADING TENSORFLOW...</span>
    </nav>

    <div id="chat-area" class="flex-1 overflow-y-auto p-4 space-y-4">
        </div>

    <div class="p-6 bg-white border-t flex flex-col items-center">
        <button id="micBtn" class="w-16 h-16 bg-gradient-to-tr from-blue-600 to-purple-600 rounded-full text-white text-2xl shadow-lg disabled:opacity-50" disabled>🎤</button>
        <p id="hint" class="mt-2 text-gray-400 text-sm">Initializing local model...</p>
    </div>

<script>
    let model;
    const chatArea = document.getElementById('chat-area');
    const micBtn = document.getElementById('micBtn');
    const status = document.getElementById('engine-status');

    // 1. LOCAL KNOWLEDGE DATABASE
    const localBrain = [
        { q: "How are you?", a: "I'm functioning perfectly on your local device! How is your English practice going?" },
        { q: "What is your name?", a: "You can call me Gemini Local. I don't need the internet to talk to you." },
        { q: "Tell me a joke", a: "Why did the programmer quit his job? Because he didn't get arrays (a raise)!" },
        { q: "Weather and outside", a: "I can't check the live weather without an API, but it's always sunny in my code!" },
        { q: "Help me with English", a: "Of course! Try telling me about your favorite movie, and I will listen to your pronunciation." }
    ];

    async function initTF() {
        model = await use.load();
        status.innerText = "ENGINE: LOCAL_TFJS_READY";
        micBtn.disabled = false;
        document.getElementById('hint').innerText = "Tap to talk (Offline)";
    }
    initTF();

    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';

    micBtn.onclick = () => recognition.start();

    recognition.onresult = async (event) => {
        const userSpeech = event.results[0][0].transcript;
        addMessage(userSpeech, 'user');
        
        // --- SIMULATE API DELAY ---
        status.innerText = "PROCESSING VECTOR...";
        
        // Turn user speech into math
        const embeddings = await model.embed([userSpeech.toLowerCase()]);
        const userVec = embeddings.arraySync()[0];

        // Find closest match in local brain
        let bestReply = "That's an interesting point! Could you explain that more simply? I'm learning your style.";
        let topScore = -1;

        for (let item of localBrain) {
            const itemEmbed = await model.embed([item.q.toLowerCase()]);
            const itemVec = itemEmbed.arraySync()[0];
            
            // Math trick: Dot product similarity
            const score = userVec.reduce((acc, val, i) => acc + val * itemVec[i], 0);
            
            if (score > topScore && score > 0.6) {
                topScore = score;
                bestReply = item.a;
            }
        }

        setTimeout(() => {
            addMessage(bestReply, 'ai');
            speak(bestReply);
            status.innerText = "ENGINE: IDLE";
        }, 1200); // Fake "API Latency"
    };

    function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = sender === 'user' ? "bg-blue-500 text-white p-3 rounded-2xl ml-auto max-w-[80%]" : "bg-gray-200 text-gray-800 p-3 rounded-2xl mr-auto max-w-[80%]";
        div.innerText = text;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
    }

    function speak(text) {
        const utter = new SpeechSynthesisUtterance(text);
        window.speechSynthesis.speak(utter);
    }
</script>
</body>
</html>
