<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Megha v4.7 | Elite Neural Sync</title>
    <script src="https://unpkg.com/compromise"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "talkinghead": "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.1/modules/talkinghead.mjs"
        }
    }
    </script>
    <style>
        :root { --b: #050505; --accent: #00d2ff; --s: #ff2d55; --g: #00ff88; --wa: #0b141a; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--b); color: #fff; font-family: -apple-system, sans-serif; height: 100dvh; overflow: hidden; }

        /* --- MASK --- */
        #mask { height: 100%; display: flex; flex-direction: column; background: #1c1c1e; position: relative; }
        #gate { position: absolute; top: 10px; left: 10px; width: 40px; height: 40px; background: var(--accent); border-radius: 50%; opacity: 0.02; z-index: 1000; cursor: pointer; }
        .canvas { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0a0a0a; color: #222; }

        /* --- CHAT --- */
        #brain { display: none; height: 100%; flex-direction: column; background: var(--wa); }
        #chat-flow { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-size: cover; }
        
        /* --- 3D LIVE --- */
        #live-ui { display: none; position: fixed; inset: 0; background: #000; z-index: 20000; flex-direction: column; }
        #avatar-box { flex: 1; width: 100%; }
        #status-txt { position: absolute; top: 20px; width: 100%; text-align: center; color: var(--accent); font-size: 10px; letter-spacing: 2px; }

        /* --- UI COMPONENTS --- */
        .panel { position: fixed; bottom: -100%; left: 0; width: 100%; height: 92%; background: #0a0a0a; border-top: 1px solid var(--accent); border-radius: 25px 25px 0 0; padding: 20px; z-index: 10000; transition: 0.4s; overflow-y: auto; }
        .panel.open { bottom: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
        .card { background: #161616; padding: 10px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .card img { width: 100%; height: 110px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        
        .btn { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: bold; width: 100%; cursor: pointer; font-size: 11px; margin-top: 5px; }
        .btn-red { background: var(--s); color: #fff; }
        #v-screen { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="mask">
        <div id="gate" onclick="vOpen()"></div>
        <div class="canvas">
            <button onclick="document.getElementById('upl').click()" style="background:#111; border:1px solid #333; color:#555; padding:15px 30px; border-radius:30px;">+ LOAD IMAGE CORE</button>
            <input type="file" id="upl" multiple hidden onchange="bulkU(this)">
        </div>
        <div style="height:80px; background:#1c1c1e; display:flex; justify-content:space-around; align-items:center;">
            <div onclick="pOpen('p-media')" style="font-size:24px;">🖼️</div>
            <div onclick="pOpen('p-sec')" style="font-size:24px;">⚙️</div>
            <div onclick="location.reload()" style="font-size:24px;">🔄</div>
        </div>
    </div>

    <div id="v-screen"><canvas id="lock" width="300" height="300"></canvas></div>

    <div id="brain">
        <div style="background:#1f2c33; padding:15px; display:flex; align-items:center; gap:12px;">
            <div id="av-mini" style="width:40px; height:40px; background:var(--accent); border-radius:50%; overflow:hidden;"></div>
            <div><strong id="ai-n">Megha ❤️</strong><br><small style="color:var(--g); font-size:10px;">online</small></div>
            <button onclick="location.reload()" style="margin-left:auto; background:none; border:none; color:#fff; font-size:25px;">×</button>
        </div>
        <div id="chat-flow"></div>
        <div style="padding:15px; background:#121212; display:flex; gap:10px;">
            <textarea id="t-inp" placeholder="Type message..." style="flex:1; height:50px; background:#1e1e1e; border:none; border-radius:20px; padding:15px; color:#fff; resize:none;"></textarea>
            <button onclick="run()" style="background:var(--accent); border:none; width:50px; height:50px; border-radius:50%; font-size:20px;">🚀</button>
        </div>
    </div>

    <div id="live-ui">
        <div id="status-txt">NEURAL_MESH_LOADING...</div>
        <div id="avatar-box"></div>
        <div style="height:100px; background:#111; display:flex; justify-content:center; align-items:center; gap:20px; padding-bottom:20px;">
            <button class="btn" style="width:130px;" onclick="liveOff()">OFFLINE</button>
            <button class="btn" style="width:130px; background:var(--g)" onclick="window.pose('wave')">WAVE</button>
        </div>
    </div>

    <div id="p-media" class="panel">
        <h3 style="color:var(--accent)">Stored Assets</h3>
        <div id="g-grid" class="grid"></div>
        <button class="btn" style="margin-top:20px; background:#222; color:#fff;" onclick="pClose()">BACK</button>
    </div>

    <div id="p-sec" class="panel">
        <h3>System Settings</h3>
        <input type="text" id="ren" placeholder="Rename AI" style="width:100%; padding:15px; margin-top:15px; background:#111; border:1px solid #333; color:#fff; border-radius:15px;">
        <button class="btn" onclick="save()">SAVE SETTINGS</button>
        <button class="btn btn-red" style="margin-top:40px;" onclick="wipe()">WIPE ALL LOCAL DATA</button>
    </div>

<script type="module">
    import { TalkingHead } from "talkinghead";
    import * as THREE from "three";

    let db, head, live = false, pth = [];
    let lock = "[0,1,2,5,8,7,6,3,4]";
    const S = "store", K_G = "gallery", K_S = "settings", K_A = "avatar", K_R = "rom";

    const req = indexedDB.open("MeghaCore_v4", 1);
    req.onupgradeneeded = (e) => e.target.result.createObjectStore(S);
    req.onsuccess = (e) => { db = e.target.result; boot(); };

    async function boot() {
        lockInit(); render();
        const c = await get(K_S) || { n: "Megha ❤️", p: lock };
        document.getElementById('ai-n').innerText = c.n;
        lock = c.p;
        const a = await get(K_A);
        if(a) document.getElementById('av-mini').innerHTML = `<img src="${a}" style="width:100%; height:100%; object-fit:cover;">`;
    }

    // --- 3D ENGINE ---
    window.goLive = async () => {
        document.getElementById('live-ui').style.display = 'flex';
        live = true;
        if(!head) {
            try {
                const node = document.getElementById('avatar-box');
                head = new TalkingHead(node, { cameraView: "upper", lipsyncModules: ["en"] });
                // Use a stable, high-performance Indian avatar mesh
                await head.loadAvatar("https://models.readyplayer.me/65842f7c32e987c8d9e2b1f4.glb");
                document.getElementById('status-txt').innerText = "LINK_ACTIVE_100%";
                setTimeout(()=> document.getElementById('status-txt').style.display='none', 2000);
                head.playAnimation("wave");
                head.speakText("Neural link is now stable. I am live.");
            } catch (e) {
                console.error("3D Error:", e);
                document.getElementById('status-txt').innerHTML = "ERROR: BROWSER_BLOCKED_CORS<br><small>Please use a Live Server or host on GitHub.</small>";
            }
        }
    };

    window.liveOff = () => { document.getElementById('live-ui').style.display='none'; live=false; if(head) head.stopSpeaking(); };
    window.pose = (p) => { if(head) head.playAnimation(p); };

    // --- BRAIN LOGIC ---
    window.run = async () => {
        const u = document.getElementById('t-inp').value.trim();
        if(!u) return;
        msg('me', u);
        document.getElementById('t-inp').value = "";
        
        const rom = await get(K_R) || [];
        const match = rom.find(r => u.toLowerCase().includes(r.txt.substring(0,5).toLowerCase()));
        let res = match ? `Checking database... I remember: ${match.txt.substring(0,40)}...` : `I am processing your request. How else can I assist?`;

        if(live) {
            head.speakText(res);
        } else {
            const b = msg('her', "");
            const n = b.querySelector('.txt');
            let s = "";
            for(let c of res){ s+=c; n.innerText=s; await new Promise(r=>setTimeout(r, 10)); }
            const ut = new SpeechSynthesisUtterance(res);
            ut.pitch = 1.2; window.speechSynthesis.speak(ut);
        }
    };

    // --- GALLERY ---
    window.bulkU = async (i) => {
        const fs = Array.from(i.files);
        let g = await get(K_G) || [];
        for (let f of fs) {
            const r = new FileReader();
            r.onload = async (e) => {
                g.push({ id: Date.now(), img: e.target.result });
                await set(K_G, g); render();
            };
            r.readAsDataURL(f);
        }
    };

    window.render = async () => {
        const g = await get(K_G) || [];
        document.getElementById('g-grid').innerHTML = g.map((x, i) => `
            <div class="card">
                <img src="${x.img}">
                <button class="btn" onclick="setA('${x.img}')">SET AVATAR</button>
                <button class="btn" style="background:var(--g)" onclick="window.goLive()">GO LIVE</button>
                <button class="btn" style="background:var(--s); color:#fff; height:30px; font-size:9px; padding:0" onclick="delM(${i})">DELETE</button>
            </div>`).join('');
    };

    window.setA = async (u) => { await set(K_A, u); location.reload(); };
    window.delM = async (i) => { let g = await get(K_G); g.splice(i,1); await set(K_G, g); render(); };

    // --- VAULT ---
    window.vOpen = () => { document.getElementById('v-screen').style.display='flex'; };
    function lockInit() {
        const c=document.getElementById('lock'), ctx=c.getContext('2d'), d=[];
        for(let i=0; i<3; i++) for(let j=0; j<3; j++) d.push({x:j*100+50, y:i*100+50, id:i*3+j});
        const dr = () => {
            ctx.clearRect(0,0,300,300);
            d.forEach(x => { ctx.beginPath(); ctx.arc(x.x, x.y, 15, 0, 7); ctx.fillStyle = pth.includes(x.id)?'#00d2ff':'#222'; ctx.fill(); });
            if(pth.length){ ctx.beginPath(); ctx.strokeStyle='#00d2ff'; ctx.lineWidth=6; ctx.moveTo(d[pth[0]].x, d[pth[0]].y); pth.forEach(p=>ctx.lineTo(d[p].x, d[p].y)); ctx.stroke(); }
        };
        c.ontouchmove = (e) => {
            const r=c.getBoundingClientRect(); const t=e.touches[0];
            d.forEach(x => { if(Math.hypot(x.x-(t.clientX-r.left), x.y-(t.clientY-r.top)) < 30 && !pth.includes(x.id)){ pth.push(x.id); dr(); } });
        };
        c.ontouchend = () => {
            if(JSON.stringify(pth) === lock) {
                document.getElementById('v-screen').style.display='none';
                document.getElementById('mask').style.display='none';
                document.getElementById('brain').style.display='flex';
            }
            pth=[]; dr();
        }; dr();
    }

    // --- DB UTILS ---
    async function get(k){return new Promise(r=>{const t=db.transaction(S,"readonly").objectStore(S).get(k); t.onsuccess=()=>r(t.result);})}
    async function set(k,v){return new Promise(r=>{const t=db.transaction(S,"readwrite").objectStore(S).put(v,k); t.onsuccess=()=>r();})}
    window.pOpen = (id) => document.getElementById(id).classList.add('open');
    window.pClose = () => document.querySelectorAll('.panel').forEach(p=>p.classList.remove('open'));
    window.save = async () => { const n=document.getElementById('ren').value; if(n){ await set(K_S, {n, p:lock}); location.reload(); }};
    window.wipe = async () => { if(confirm("Wipe all data?")){ await db.transaction(S,"readwrite").objectStore(S).clear(); location.reload(); }};
    function msg(s, t) {
        const c = document.getElementById('chat-flow');
        const d = document.createElement('div');
        d.style.alignSelf = s==='me'?'flex-end':'flex-start';
        d.innerHTML = `<div style="background:${s==='me'?'#056162':'#262d31'}; padding:12px; border-radius:18px; max-width:85%;"><span class="txt" style="font-size:15px;">${t}</span></div>`;
        c.appendChild(d); c.scrollTop = c.scrollHeight; return d;
    }
</script>
</body>
</html>
