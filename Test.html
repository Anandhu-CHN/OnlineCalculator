<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Diya AI Tutor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root { --accent: #00d2ff; --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; background: #05050a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
        
        /* 3D Scene - Responsive Height */
        #canvas-container { flex: 1; width: 100%; position: relative; }

        /* UI Panel */
        .ui-panel { height: 45%; background: linear-gradient(to top, #000 85%, transparent); display: flex; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; z-index: 10; }
        #status { font-size: 10px; letter-spacing: 2px; color: var(--accent); margin-bottom: 15px; font-weight: bold; }
        #transcript { background: var(--glass); backdrop-filter: blur(10px); padding: 20px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 500px; text-align: center; font-size: 16px; line-height: 1.4; min-height: 50px; }

        /* Setup Overlay */
        .overlay { position: fixed; inset: 0; background: #05050a; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        input { width: 100%; max-width: 300px; padding: 15px; border-radius: 15px; border: 1px solid #333; background: #111; color: var(--accent); margin-bottom: 20px; text-align: center; }
        .btn-start { padding: 15px 60px; background: var(--accent); border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 210, 255, 0.3); }

        /* Controls */
        .controls { position: absolute; bottom: 20px; display: flex; gap: 20px; }
        .icon-btn { width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--accent); color: white; font-size: 24px; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.4); }
        .mic-active { background: #ff4b2b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 75, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); } }
    </style>
</head>
<body>

<div id="setup" class="overlay">
    <h1 style="letter-spacing:5px">DIYA AI</h1>
    <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxx">
    <button class="btn-start" onclick="startApp()">WAKE UP</button>
</div>

<div id="canvas-container"></div>

<div class="ui-panel">
    <div id="status">OFFLINE</div>
    <div id="transcript">Tap Wake Up to start the session.</div>
    <div class="controls">
        <button class="icon-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    </div>
</div>

<script>
    let token, scene, camera, renderer, model, recognition;
    const synth = window.speechSynthesis;
    let isSpeaking = false;

    // 1. Initialize 3D (Responsive)
    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight * 0.55), 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight * 0.55);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geo = new THREE.TorusKnotGeometry(0.8, 0.25, 100, 16);
        const mat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, wireframe: true });
        model = new THREE.Mesh(geo, mat);
        scene.add(model);

        const light = new THREE.DirectionalLight(0xffffff, 1);
        light.position.set(1, 1, 2);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0x404040));
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            model.rotation.y += 0.01;
            if(isSpeaking) {
                const s = 1 + Math.sin(Date.now() * 0.02) * 0.1;
                model.scale.set(s,s,s);
            }
            renderer.render(scene, camera);
        }
        animate();
    }

    // 2. Start App
    window.startApp = () => {
        token = document.getElementById('hfToken').value.trim();
        if(!token) return alert("Please enter your token.");
        document.getElementById('setup').style.display = 'none';
        init3D();
        initMic();
        speak("I am Diya. I am ready to help you learn.");
    };

    // 3. Raw Fetch Logic (No Library Needed)
    async function askAI(userInput) {
        document.getElementById('status').innerText = "THINKING...";
        try {
            const response = await fetch("https://api-inference.huggingface.co/models/deepseek-ai/DeepSeek-R1-Distill-Qwen-7B", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    inputs: `You are Diya, a cute girl tutor. Answer briefly in one sentence: ${userInput}`,
                    parameters: { max_new_tokens: 60, return_full_text: false }
                })
            });

            const data = await response.json();
            // DeepSeek fix: remove thinking tags
            let reply = (data[0].generated_text || data.generated_text).replace(/<think>[\s\S]*?<\/think>/g, '').trim();
            speak(reply);
        } catch (e) {
            console.error(e);
            document.getElementById('status').innerText = "CONNECTION ERROR";
            speak("I am having trouble connecting to my brain.");
        }
    }

    // 4. Speech Logic
    function initMic() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.lang = 'en-US';
        recognition.onstart = () => {
            document.getElementById('status').innerText = "LISTENING...";
            document.getElementById('micBtn').classList.add('mic-active');
        };
        recognition.onresult = (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('transcript').innerText = text;
            askAI(text);
        };
        recognition.onend = () => {
            document.getElementById('micBtn').classList.remove('mic-active');
            if(!isSpeaking) setTimeout(() => { try { recognition.start(); } catch(e) {} }, 1000);
        };
        recognition.start();
    }

    window.toggleMic = () => { 
        try { recognition.start(); } catch(e) { recognition.stop(); } 
    };

    function speak(text) {
        isSpeaking = true;
        recognition.stop();
        const msg = new SpeechSynthesisUtterance(text);
        msg.onstart = () => {
            document.getElementById('status').innerText = "SPEAKING...";
            document.getElementById('transcript').innerText = text;
        };
        msg.onend = () => {
            isSpeaking = false;
            document.getElementById('status').innerText = "WAITING...";
            setTimeout(() => { try { recognition.start(); } catch(e) {} }, 500);
        };
        synth.speak(msg);
    }

    // Fix for mobile window resizing
    window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight * 0.55);
        camera.aspect = window.innerWidth / (window.innerHeight * 0.55);
        camera.updateProjectionMatrix();
    });
</script>
</body>
</html>
