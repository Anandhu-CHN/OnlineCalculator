
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <style>
            :root { --accent: #00d2ff; --bg: #05050a; }
            body, #diya-app { 
                margin: 0; padding: 0; width: 100%; height: 100vh; 
                background: var(--bg); color: white; font-family: sans-serif; 
                display: flex; flex-direction: column; overflow: hidden;
            }
            #canvas-container { flex: 1; width: 100%; }
            .ui { 
                padding: 20px; background: rgba(0,0,0,0.8); 
                display: flex; flex-direction: column; align-items: center; gap: 15px;
            }
            #transcript { 
                background: rgba(255,255,255,0.05); padding: 15px; border-radius: 15px;
                width: 90%; text-align: center; font-size: 14px; min-height: 40px;
            }
            .mic-btn { 
                width: 70px; height: 70px; border-radius: 50%; border: none; 
                background: var(--accent); color: white; font-size: 30px; cursor: pointer;
                box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
            }
            .listening { background: #ff4b2b; animation: pulse 1s infinite; }
            @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
            .overlay { 
                position: fixed; inset: 0; background: var(--bg); z-index: 100;
                display: flex; flex-direction: column; align-items: center; justify-content: center;
            }
            input { padding: 12px; border-radius: 8px; border: 1px solid #333; background: #111; color: var(--accent); margin-bottom: 15px; width: 260px; text-align: center; }
        </style>
    </head>
    <body>

    <div id="diya-app">
        <div id="setup" class="overlay">
            <h2 style="letter-spacing:3px">DIYA TUTOR</h2>
            <p style="font-size: 12px; color: #666;">Token Name: Diya_Tutor</p>
            <input type="password" id="hfToken" placeholder="Paste HF Token (hf_...)">
            <button onclick="startApp()" style="padding: 12px 40px; background: var(--accent); border: none; border-radius: 20px; color: white; font-weight: bold; cursor: pointer;">WAKE UP</button>
        </div>

        <div id="canvas-container"></div>
        
        <div class="ui">
            <div id="status" style="font-size: 10px; color: var(--accent);">READY</div>
            <div id="transcript">Tap the mic to talk to Diya</div>
            <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        </div>
    </div>

    <script>
        let token, scene, camera, renderer, avatar, recognition;
        const synth = window.speechSynthesis;
        let isSpeaking = false;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight * 0.6), 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight * 0.6);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const geo = new THREE.TorusKnotGeometry(0.7, 0.2, 100, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0x00d2ff, wireframe: true });
            avatar = new THREE.Mesh(geo, mat);
            scene.add(avatar);

            scene.add(new THREE.AmbientLight(0xffffff, 1.5));
            camera.position.z = 2.5;

            function animate() {
                requestAnimationFrame(animate);
                avatar.rotation.y += 0.01;
                if(isSpeaking) {
                    avatar.scale.setScalar(1 + Math.sin(Date.now() * 0.01) * 0.1);
                }
                renderer.render(scene, camera);
            }
            animate();
        }

        window.startApp = () => {
            token = document.getElementById('hfToken').value.trim();
            if(!token) return alert("Please enter your token.");
            document.getElementById('setup').style.display = 'none';
            init3D();
            initMic();
            speak("I am awake. How can I help you today?");
        };

        async function askAI(input) {
            document.getElementById('status').innerText = "THINKING...";
            try {
                // Using the NEW Chat Completion Router
                const res = await fetch("https://api-inference.huggingface.co/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${token}`, 
                        "Content-Type": "application/json" 
                    },
                    body: JSON.stringify({
                        model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B",
                        messages: [
                            { role: "system", content: "You are Diya, a friendly girl tutor. Keep answers short." },
                            { role: "user", content: input }
                        ],
                        max_tokens: 100
                    })
                });

                const data = await res.json();
                
                if(data.error) throw new Error(data.error.message || data.error);

                let reply = data.choices[0].message.content;
                // Remove reasoning tags if model includes them
                reply = reply.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
                speak(reply);
            } catch (e) {
                document.getElementById('status').innerText = "BRAIN ERROR";
                console.error(e);
                speak("I'm sorry, my brain is a bit fuzzy right now.");
            }
        }

        function initMic() {
            const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new Speech();
            recognition.lang = 'en-US';
            recognition.onstart = () => {
                document.getElementById('status').innerText = "LISTENING...";
                document.getElementById('micBtn').classList.add('listening');
            };
            recognition.onresult = (e) => {
                const text = e.results[0][0].transcript;
                document.getElementById('transcript').innerText = text;
                askAI(text);
            };
            recognition.onend = () => {
                document.getElementById('micBtn').classList.remove('listening');
                if(!isSpeaking) document.getElementById('status').innerText = "READY";
            };
        }

        window.toggleMic = () => { 
            try { recognition.start(); } catch(e) { recognition.stop(); } 
        };

        function speak(text) {
            isSpeaking = true;
            recognition.stop();
            const msg = new SpeechSynthesisUtterance(text);
            msg.onstart = () => {
                document.getElementById('status').innerText = "SPEAKING...";
                document.getElementById('transcript').innerText = text;
            };
            msg.onend = () => {
                isSpeaking = false;
                document.getElementById('status').innerText = "READY";
            };
            synth.speak(msg);
        }
    </script>
    </body>
    </html>
