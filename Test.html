<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diya Live: Loop Fixed</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #0a0a12; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; }
        .ui { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none; }
        #status { font-size: 14px; color: #4facfe; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
        #transcript { background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); padding: 15px 25px; border-radius: 30px; border: 1px solid #4facfe; max-width: 80%; text-align: center; min-height: 1.4em; }
        .setup { position: fixed; inset: 0; background: #0a0a12; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        input { padding: 15px; border-radius: 10px; border: 1px solid #333; background: #1a1a2e; color: white; width: 280px; margin-bottom: 20px; font-size: 16px; text-align: center;}
        .btn { pointer-events: auto; padding: 15px 50px; background: #4facfe; border: none; border-radius: 30px; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
        #mic-indicator { position: absolute; top: 20px; right: 20px; width: 15px; height: 15px; border-radius: 50%; background: grey; }
    </style>
</head>
<body>

<div id="setup" class="setup">
    <h1>Diya AI</h1>
    <input type="password" id="hfToken" placeholder="hf_xxxxxxxxxxxxxxxxx">
    <button class="btn" onclick="startApp()">WAKE UP DIYA</button>
</div>

<div id="mic-indicator"></div>
<div id="canvas-container"></div>

<div class="ui">
    <div id="status">Ready</div>
    <div id="transcript">Click Wake Up to begin</div>
</div>

<script type="module">
    import { HfInference } from "https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/+esm";

    let scene, camera, renderer, avatar, hf, recognition;
    const synth = window.speechSynthesis;
    let isSpeaking = false;

    window.startApp = () => {
        const token = document.getElementById('hfToken').value.trim();
        if(!token) return alert("Please enter your Token.");
        hf = new HfInference(token);
        document.getElementById('setup').style.display = 'none';
        
        init3D();
        initVoice();
        speak("Hello! I am back. I will keep listening now. How are you?");
    };

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.TorusKnotGeometry(0.7, 0.2, 100, 16);
        const material = new THREE.MeshStandardMaterial({ color: 0x4facfe, wireframe: true });
        avatar = new THREE.Mesh(geometry, material);
        scene.add(avatar);

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            avatar.rotation.y += 0.01;
            if(isSpeaking) {
                const s = 1 + Math.sin(Date.now() * 0.01) * 0.1;
                avatar.scale.set(s,s,s);
            }
            renderer.render(scene, camera);
        }
        animate();
    }

    function initVoice() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.continuous = false; // We handle continuity manually for better stability
        recognition.interimResults = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => {
            document.getElementById('status').innerText = "Diya is listening...";
            document.getElementById('mic-indicator').style.background = "#4facfe";
        };

        recognition.onresult = async (event) => {
            const text = event.results[0][0].transcript;
            document.getElementById('transcript').innerText = `You: ${text}`;
            processAI(text);
        };

        recognition.onend = () => {
            // ONLY restart if Diya is not talking. 
            // If she is talking, the 'speak' function will restart the mic when she finishes.
            if (!isSpeaking) {
                recognition.start();
            }
        };

        recognition.start();
    }

    async function processAI(input) {
        document.getElementById('status').innerText = "Thinking...";
        try {
            const out = await hf.chatCompletion({
                model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B",
                messages: [{ role: "user", content: `You are Diya, a friendly girl. Reply in 1 short sentence: ${input}` }],
                max_tokens: 100
            });
            const reply = out.choices[0].message.content.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
            speak(reply);
        } catch (e) {
            console.error(e);
            speak("I had a small glitch. Can you say that again?");
        }
    }

    function speak(text) {
        isSpeaking = true;
        recognition.stop(); // Stop listening while she talks to prevent feedback loop

        const msg = new SpeechSynthesisUtterance(text);
        msg.onstart = () => {
            document.getElementById('status').innerText = "Diya is speaking...";
            document.getElementById('transcript').innerText = `Diya: ${text}`;
        };

        msg.onend = () => {
            isSpeaking = false;
            document.getElementById('status').innerText = "Waiting...";
            // IMPORTANT: Restart the "ears" after she is done talking
            setTimeout(() => { recognition.start(); }, 500); 
        };

        synth.speak(msg);
    }
</script>
</body>
</html>
