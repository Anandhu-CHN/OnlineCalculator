<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diya Live: Custom Voices</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; background: #05050a; overflow: hidden; font-family: 'Segoe UI', sans-serif; color: white; }
        #canvas-container { width: 100vw; height: 100vh; position: absolute; }
        
        /* UI Controls */
        .controls { position: absolute; top: 20px; left: 20px; z-index: 100; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 15px; border: 1px solid #4facfe; display: none; }
        select, input[type="range"] { width: 100%; margin-top: 5px; margin-bottom: 10px; background: #222; color: white; border: 1px solid #444; border-radius: 5px; padding: 5px; }
        label { font-size: 12px; color: #4facfe; text-transform: uppercase; }

        .ui { position: absolute; bottom: 40px; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; pointer-events: none; }
        #status { font-size: 14px; color: #4facfe; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; font-weight: bold; }
        #transcript { background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); padding: 18px 30px; border-radius: 35px; border: 1px solid rgba(79, 172, 254, 0.3); max-width: 80%; text-align: center; }

        .setup { position: fixed; inset: 0; background: #05050a; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .btn { pointer-events: auto; padding: 16px 60px; background: #4facfe; border: none; border-radius: 35px; color: white; font-weight: bold; cursor: pointer; font-size: 18px; }
    </style>
</head>
<body>

<div id="setup" class="setup">
    <h1>Diya AI</h1>
    <input type="password" id="hfToken" placeholder="Enter HF Token" style="padding:15px; border-radius:10px; margin-bottom:20px; width:280px; text-align:center;">
    <button class="btn" onclick="startApp()">START SESSION</button>
</div>

<div class="controls" id="voiceControls">
    <label>Pick Accent/Voice</label>
    <select id="voiceSelect"></select>
    
    <label>Talking Speed</label>
    <input type="range" id="rate" min="0.5" max="2" value="1" step="0.1">
</div>

<div id="canvas-container"></div>

<div class="ui">
    <div id="status">OFFLINE</div>
    <div id="transcript">Ready to start...</div>
</div>

<script type="module">
    import { HfInference } from "https://cdn.jsdelivr.net/npm/@huggingface/inference@2.6.4/+esm";

    let scene, camera, renderer, avatar, hf, recognition;
    const synth = window.speechSynthesis;
    let voices = [];
    let isSpeaking = false;

    // Load available voices
    function populateVoices() {
        voices = synth.getVoices();
        const select = document.getElementById('voiceSelect');
        select.innerHTML = '';
        
        // Filter for English voices primarily, but show all
        voices.forEach((voice, i) => {
            const option = document.createElement('option');
            option.value = i;
            option.textContent = `${voice.name} (${voice.lang})`;
            // Try to default to a natural sounding female voice if available
            if(voice.name.includes("Google US English") || voice.name.includes("Samantha")) {
                option.selected = true;
            }
            select.appendChild(option);
        });
    }

    // Required because getVoices() loads asynchronously
    if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
    }

    window.startApp = () => {
        const token = document.getElementById('hfToken').value.trim();
        if(!token) return alert("Token required!");
        hf = new HfInference(token);
        document.getElementById('setup').style.display = 'none';
        document.getElementById('voiceControls').style.display = 'block';
        
        init3D();
        initVoice();
        populateVoices(); 
        speak("Voice systems initialized. You can change my accent in the top left menu.");
    };

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const geometry = new THREE.IcosahedronGeometry(1, 4);
        const material = new THREE.MeshStandardMaterial({ color: 0x4facfe, wireframe: true });
        avatar = new THREE.Mesh(geometry, material);
        scene.add(avatar);

        scene.add(new THREE.AmbientLight(0xffffff, 1));
        camera.position.z = 3;

        function animate() {
            requestAnimationFrame(animate);
            avatar.rotation.y += 0.01;
            if(isSpeaking) {
                const s = 1 + Math.sin(Date.now() * 0.02) * 0.2;
                avatar.scale.set(s,s,s);
            }
            renderer.render(scene, camera);
        }
        animate();
    }

    function initVoice() {
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new Speech();
        recognition.continuous = false;
        recognition.lang = 'en-US';

        recognition.onstart = () => document.getElementById('status').innerText = "Listening...";
        recognition.onresult = async (e) => {
            const text = e.results[0][0].transcript;
            document.getElementById('transcript').innerText = `You: ${text}`;
            processAI(text);
        };
        recognition.onend = () => { if(!isSpeaking) recognition.start(); };
        recognition.start();
    }

    async function processAI(input) {
        document.getElementById('status').innerText = "Thinking...";
        try {
            const out = await hf.chatCompletion({
                model: "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B",
                messages: [{ role: "user", content: `You are Diya. Reply briefly: ${input}` }],
                max_tokens: 100
            });
            let reply = out.choices[0].message.content.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
            speak(reply);
        } catch (e) {
            speak("Brain connection reset. Try again.");
        }
    }

    function speak(text) {
        isSpeaking = true;
        recognition.stop();
        
        const msg = new SpeechSynthesisUtterance(text);
        
        // Apply custom voice and speed
        const selectedVoiceIndex = document.getElementById('voiceSelect').value;
        if(voices[selectedVoiceIndex]) {
            msg.voice = voices[selectedVoiceIndex];
        }
        msg.rate = document.getElementById('rate').value;

        msg.onstart = () => {
            document.getElementById('status').innerText = "Speaking...";
            document.getElementById('transcript').innerText = `Diya: ${text}`;
        };
        msg.onend = () => {
            isSpeaking = false;
            document.getElementById('status').innerText = "Waiting...";
            setTimeout(() => recognition.start(), 400);
        };
        synth.speak(msg);
    }
</script>
</body>
</html>
